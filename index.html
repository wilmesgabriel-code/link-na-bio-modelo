<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia do Carlos | Agendamentos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      background: linear-gradient(135deg, #1e1e2f, #12121a);
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 400px; text-align: center; }
    .avatar {
      width: 100px; height: 100px; border-radius: 50%;
      background: #ff9800; margin: 0 auto 15px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: bold; color: #12121a;
    }
    h1 { font-size: 22px; margin-bottom: 5px; }
    p { font-size: 14px; color: #bbbbbb; margin-bottom: 25px; }
    .btn {
      display: block; width: 100%; padding: 15px; margin-bottom: 12px;
      background: #2b2b40; color: #ffffff; text-decoration: none;
      border-radius: 10px; font-weight: bold; border: 1px solid #3f3f5a;
      cursor: pointer; font-size: 15px;
    }
    .btn-destaque { background: #25D366; color: #000000; border: none; }
    .tabela-precos {
      display: none;
      background: #222233;
      border: 1px solid #ff9800;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: left;
    }
    .item-preco {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #33334d;
      font-size: 14px;
    }
    .item-preco:last-child { border-bottom: none; }
    .preco { color: #ff9800; font-weight: bold; }
    .info { margin-top: 25px; font-size: 12px; color: #888888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">BC</div>
    <h1>Barbearia do Carlos</h1>
    <p>Corte masculino, barba e acabamento • Seg a Sáb das 9h às 19h</p>

    <a href="https://wa.me." class="btn btn-destaque">Agendar pelo WhatsApp</a>
    
    <button class="btn" onclick="var t = document.getElementById('tabela'); t.style.display = t.style.display === 'block' ? 'none' : 'block';">
      Ver Tabela de Preços
    </button>

    <div id="tabela" class="tabela-precos">
      <div class="item-preco"><span>Corte Degradê</span><span class="preco">R$ 35,00</span></div>
      <div class="item-preco"><span>Corte Social</span><span class="preco">R$ 30,00</span></div>
      <div class="item-preco"><span>Barba Completa</span><span class="preco">R$ 25,00</span></div>
      <div class="item-preco"><span>Corte + Barba</span><span class="preco">R$ 55,00</span></div>
    </div>

    <a href="https://google.com" target="_blank" class="btn">Ver Localização no Mapa</a>
    <a href="https://instagram.com" target="_blank" class="btn">Seguir no Instagram</a>

    <div class="info">Site criado por Gabriel Wilmes</div>
  </div>
</body>
</html>
